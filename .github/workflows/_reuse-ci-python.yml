name: _reuse-ci-python
on:
  workflow_call: {}
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install (best-effort)
        run: |
          python -m pip install -U pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          { [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; } && { pip install -e . || pip install . || true; } || true
          pip install ruff pytest pytest-cov pip-audit bandit mypy || true
      - name: Ruff lint (report-only)
        run: ruff check .
        continue-on-error: true
      - name: Bandit security scan (report-only)
        run: bandit -r . -q -x ./tests,./test,./.venv || true
        continue-on-error: true
      - name: Mypy types (report-only)
        run: mypy --ignore-missing-imports --no-error-summary . || true
        continue-on-error: true
      - name: Tests + coverage
        run: |
          if find . -path ./.git -prune -o -name 'test_*.py' -print -o -name '*_test.py' -print | grep -q . || [ -d tests ] || [ -d test ]; then
            pytest -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml
          else
            echo "No tests found; skipping pytest. (Add tests to raise coverage.)"
          fi
      - name: pip-audit (security, report-only)
        run: pip-audit
        continue-on-error: true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore
