name: _reuse-ci-rust
on:
  workflow_call: {}
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install common system deps (best-effort)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq \
            pkg-config cmake libssl-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype6-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev \
            libdbus-1-dev libsqlite3-dev || true
      - name: Format (report-only)
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Clippy (report-only)
        run: cargo clippy --workspace --all-targets --all-features
        continue-on-error: true
      - name: Build
        run: |
          if [ -f Cargo.toml ]; then cargo build --workspace --all-targets
          else echo "No root Cargo.toml — not a root-level crate; skipping build."; fi
      - name: Test
        run: |
          if [ -f Cargo.toml ]; then cargo test --workspace
          else echo "No root Cargo.toml; skipping tests."; fi
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
        continue-on-error: true
      - name: Coverage (report-only)
        run: cargo llvm-cov --workspace --summary-only --cobertura --output-path coverage.xml || cargo llvm-cov --workspace --summary-only
        continue-on-error: true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage.xml
          if-no-files-found: ignore
