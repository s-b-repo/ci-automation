name: _reuse-ci-shell
on:
  workflow_call: {}
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (report-only)
        uses: ludeeus/action-shellcheck@2.0.0
        continue-on-error: true
        env:
          SHELLCHECK_OPTS: -e SC1091
