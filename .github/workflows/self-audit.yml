name: Self audit

# Runs this repo's own code through the same quality / security gates we
# apply to every other repo via the _reuse-* workflows, plus a regex-based
# audit that catches the bug classes that caused the 2026-11 fix pass
# (workflow injection, error swallowing, unwired templates, Dart pubspec
# regression, loose branch-exists probe). Every finding is a build failure
# so these do not silently rot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: self-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + bandit + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -U pip ruff bandit pytest pyyaml
      - name: Ruff lint
        run: ruff check audit.py migrate.py rollout.py gen_reuse_release.py release/
      - name: Bandit security scan
        run: bandit -r audit.py migrate.py rollout.py gen_reuse_release.py release/ -q
      - name: Compile check
        run: |
          python -m py_compile audit.py migrate.py rollout.py gen_reuse_release.py \
                               release/bump-manifest.py release/release-notes.py
      - name: Tests
        run: pytest -q tests/

  shell:
    name: Shell (shellcheck + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck compute-release.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./release
      - name: bash -n
        run: bash -n release/compute-release.sh

  actions:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -version
      - name: Run actionlint
        run: ./actionlint -color

  regex-audit:
    name: Regex bug-class audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tools/audit.py
        run: python -I tools/audit.py .

  generator-up-to-date:
    name: _reuse-release.yml matches generator
    # If someone edits release/*.sh or release/*.py but forgets to re-run
    # gen_reuse_release.py, the embedded base64 blobs go stale and every
    # release across every consumer silently keeps running the old code.
    # Regenerate in CI and fail if the tree differs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate
        run: python -I gen_reuse_release.py
      - name: Check diff
        run: |
          if ! git diff --exit-code -- .github/workflows/_reuse-release.yml; then
            echo "::error::release/ scripts changed but _reuse-release.yml was not regenerated"
            echo "Run: python3 gen_reuse_release.py"
            exit 1
          fi

  unwired-templates:
    name: No orphan templates
    # Every file under templates/ must be read by at least one script or
    # referenced by another workflow file, or it is dead code masquerading
    # as documentation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check references
        run: |
          set -eu
          failed=0
          while IFS= read -r t; do
            rel="${t#./}"
            if ! grep -rqF "$rel" --include='*.py' --include='*.sh' --include='*.yml' \
                  --exclude-dir=.git --exclude="$(basename "$t")" .; then
              echo "::error file=$rel::template is not referenced by any script or workflow"
              failed=1
            fi
          done < <(find templates -type f)
          exit $failed
