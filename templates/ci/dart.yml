name: CI
on:
  push:
    branches: [__BRANCH__]
  pull_request:
    branches: [__BRANCH__]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        run: flutter pub get
      - name: Format (report-only)
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true
      - name: Analyze (report-only)
        run: flutter analyze
        continue-on-error: true
      - name: Test (report-only)
        run: flutter test
        continue-on-error: true
