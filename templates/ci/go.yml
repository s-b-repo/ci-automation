name: CI
on:
  push:
    branches: [__BRANCH__]
  pull_request:
    branches: [__BRANCH__]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet (report-only)
        run: go vet ./...
        continue-on-error: true
      - name: Test
        run: go test ./...
      - name: govulncheck (security, report-only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./... || true
        continue-on-error: true
